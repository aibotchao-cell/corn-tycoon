<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#6db35a">
<title>玉米罐頭大亨</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#3f6b34;
  touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;
  font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}
canvas{display:block;width:100%;height:100%;touch-action:none;}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
'use strict';
/* ============================================================
   《菜菜大亨》 — 單檔手機 canvas 遊戲
   收成 → 切菜 → 上架 → 客人上門買 → 升級（工人/砧板/客人/自動化）
   ============================================================ */

var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var W = 0, H = 0, DPR = 1;
var ZONES = [], BTN = [], TREES = [], POND = null, GRASS = [];

/* ---------------- 工具 ---------------- */
function rnd(a, b) { return a + Math.random() * (b - a); }
function pick(a) { return a[(Math.random() * a.length) | 0]; }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}
function fmt(n) {
  n = Math.floor(n);
  if (n >= 1000000) { return (n / 1000000).toFixed(2) + 'M'; }
  if (n >= 10000) { return (n / 1000).toFixed(1) + 'K'; }
  return String(n);
}
function txt(s, x, y, size, color, align, weight) {
  ctx.font = (weight || '700') + ' ' + size + 'px system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = Math.max(2, size * 0.16);
  ctx.strokeStyle = 'rgba(28,44,22,0.75)';
  ctx.lineJoin = 'round';
  ctx.strokeText(s, x, y);
  ctx.fillStyle = color || '#fff';
  ctx.fillText(s, x, y);
}

/* ---------------- 音效 ---------------- */
var AUD = { on: true, musOn: true, ctx: null };
function AC() {
  if (!AUD.ctx) {
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) { return null; }
    AUD.ctx = new C();
  }
  if (AUD.ctx.state === 'suspended') { AUD.ctx.resume(); }
  return AUD.ctx;
}
function tone(freq, when, dur, type, vol, slideTo) {
  var a = AC(); if (!a || !AUD.on) { return; }
  var o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, when);
  if (slideTo) { o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), when + dur); }
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(vol || 0.14, when + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  o.connect(g); g.connect(a.destination);
  o.start(when); o.stop(when + dur + 0.03);
}
function noise(dur, freq, vol, when) {
  var a = AC(); if (!a || !AUD.on) { return; }
  var t = when || a.currentTime;
  var n = Math.floor(a.sampleRate * dur);
  var buf = a.createBuffer(1, n, a.sampleRate);
  var d = buf.getChannelData(0);
  for (var i = 0; i < n; i++) { d[i] = (Math.random() * 2 - 1) * (1 - i / n); }
  var s = a.createBufferSource(); s.buffer = buf;
  var f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq || 1200;
  var g = a.createGain(); g.gain.value = vol || 0.2;
  s.connect(f); f.connect(g); g.connect(a.destination);
  s.start(t);
}
function sHarvest() { var a = AC(); if (!a) { return; } tone(560, a.currentTime, 0.12, 'sine', 0.13, 900); }
function sChop() { var a = AC(); if (!a) { return; } noise(0.10, 900, 0.18, a.currentTime); tone(180, a.currentTime, 0.09, 'square', 0.07, 110); }
function sCoin() { var a = AC(); if (!a) { return; } tone(1050, a.currentTime, 0.09, 'square', 0.07); tone(1560, a.currentTime + 0.07, 0.14, 'square', 0.06); }
function sUp() {
  var a = AC(); if (!a) { return; }
  var base = a.currentTime, f = [523, 659, 784, 1046];
  for (var i = 0; i < f.length; i++) { tone(f[i], base + i * 0.075, 0.24, 'triangle', 0.11); }
}
function sNo() { var a = AC(); if (!a) { return; } tone(150, a.currentTime, 0.16, 'sawtooth', 0.09, 90); }
function sCust() { var a = AC(); if (!a) { return; } tone(880, a.currentTime, 0.07, 'triangle', 0.05, 660); }
function sBell() { var a = AC(); if (!a) { return; } tone(1318, a.currentTime, 0.5, 'sine', 0.07); tone(1976, a.currentTime + 0.02, 0.4, 'sine', 0.04); }

var MUS = { next: 0, i: 0 };
var MEL = [0, 4, 7, 4, 0, -3, 0, 4];
function musTick() {
  var a = AUD.ctx;
  if (!a || !AUD.musOn || !AUD.on || S.paused || !S.started) { return; }
  var t = a.currentTime;
  if (MUS.next < t) { MUS.next = t + 0.06; }
  while (MUS.next < t + 0.5) {
    var n = MEL[MUS.i % MEL.length];
    tone(261.6 * Math.pow(2, n / 12), MUS.next, 0.30, 'triangle', 0.035);
    if (MUS.i % 4 === 0) { tone(65.4 * Math.pow(2, MEL[(MUS.i >> 2) % MEL.length] / 24), MUS.next, 0.7, 'sine', 0.05); }
    if (MUS.i % 8 === 4) { noise(0.04, 3000, 0.03, MUS.next); }
    MUS.i++; MUS.next += 0.30;
  }
}
setInterval(musTick, 120);

/* ---------------- 升級表 ---------------- */
var UPGS = [
  { id: 'speed', ic: '👟', n: '草鞋', d: '移動速度 +12%', base: 30, mul: 1.55, max: 10,
    val: function (l) { return '×' + (Math.pow(1.12, l)).toFixed(2); } },
  { id: 'bag', ic: '🎒', n: '背包', d: '背包容量 +2', base: 25, mul: 1.55, max: 12,
    val: function (l) { return (6 + 2 * l) + ' 格'; } },
  { id: 'field', ic: '🌱', n: '肥沃土壤', d: '玉米長更快、田 +1 格', base: 40, mul: 1.60, max: 12,
    val: function (l) { return (6 + l) + ' 格'; } },
  { id: 'knife', ic: '🥫', n: '增設裝罐機', d: '裝罐更快、裝罐機 +1', base: 45, mul: 1.60, max: 10,
    val: function (l) { return (1 + l) + ' 台'; } },
  { id: 'price', ic: '🗣️', n: '好口條', d: '罐頭價 +8%', base: 50, mul: 1.65, max: 14,
    val: function (l) { return '×' + (Math.pow(1.08, l)).toFixed(2); } },
  { id: 'sign', ic: '📣', n: '招牌', d: '客人上限 +1、來客更快更多', base: 80, mul: 1.70, max: 10,
    val: function (l) { return (2 + l) + ' 位'; } },
  { id: 'market', ic: '⏱️', n: '市場通路', d: '客人買罐頭速度 +25%', base: 120, mul: 1.60, max: 10,
    val: function (l) { return '×' + (Math.pow(1.25, l)).toFixed(2); } },
  { id: 'autoFarm', ic: '🚜', n: '自動收割', d: '收割機自己下田收玉米', base: 150, mul: 1.80, max: 6,
    val: function (l) { return l + ' 台'; } },
  { id: 'autoCan', ic: '⚙️', n: '自動裝罐', d: '輸送帶＋裝罐機：玉米自動變罐頭', base: 260, mul: 1.85, max: 6,
    val: function (l) { return l + ' 台'; } },
  { id: 'autoSell', ic: '🚚', n: '自動運去賣', d: '輸送帶＋搬運車：罐頭自動上架', base: 380, mul: 1.90, max: 6,
    val: function (l) { return l + ' 台'; } },
  { id: 'carry', ic: '💪', n: '快手', d: '動作一次多做 +1（自動化也適用）', base: 250, mul: 2.00, max: 6,
    val: function (l) { return '一次 ' + (1 + l) + ' 個'; } }
];
function U(id) { for (var i = 0; i < UPGS.length; i++) { if (UPGS[i].id === id) { return UPGS[i]; } } return null; }

/* ---------------- 狀態 ---------------- */
var WCOL = ['#4f7fd4', '#c96ad0', '#e0b13d', '#4fb7a4', '#d4694f', '#7a6fd4'];
var S = {
  started: false, paused: false, shopOpen: false, inShop: false,
  coins: 0, totalEarned: 0,
  crop: 0, veg: 0, stallStock: 0,
  fieldReady: 6, harvestT: 0,
  L: {},                       // 升級等級
  workers: [], customers: [], bA: [], bB: [], bAT: 0, bBT: 0,
  autoH: 0, autoC: 0, autoS: 0,
  custTimer: 2.5, actName: '', actT: 0, actNeed: 1,
  earn: [],                    // 每分鐘收入
  resetArm: 0,
  t: 0
};
function lv(id) { return S.L[id] || 0; }
function D() {                              // 由等級推導出的數值
  var f = {};
  f.spd = 88 * Math.pow(1.12, lv('speed'));
  f.bag = 6 + 2 * lv('bag');
  f.fieldMax = 6 + lv('field');
  f.fieldRate = (1 / 0.70) * (1 + 0.12 * lv('field'));
  f.harvestTime = 0.55;
  f.chopTime = 0.70 / Math.pow(1.15, lv('knife'));
  f.shelfTime = 0.22;
  f.boards = Math.min(3, 1 + lv('knife'));
  f.price = 6 * Math.pow(1.08, lv('price')) * Math.pow(1.03, lv('sign'));
  f.qmax = 2 + lv('sign');
  f.custGap = Math.max(1.0, 3.5 / (1 + 0.30 * lv('sign')));
  f.eatTime = 0.75 / Math.pow(1.25, lv('market'));
  f.carry = 1 + lv('carry');
  return f;
}
function cost(u) { return Math.floor(u.base * Math.pow(u.mul, lv(u.id))); }
function space() { return D().bag - S.crop - S.veg; }

/* ---------------- 特效 ---------------- */
var FX = [];
function popText(x, y, s, color, size) {
  FX.push({ k: 't', x: x, y: y, vy: -42, life: 1.1, max: 1.1, s: s, c: color || '#fff', sz: size || 20 });
}
function puff(x, y, c) {
  FX.push({ k: 'p', x: x, y: y, vx: rnd(-40, 40), vy: rnd(-60, -10), life: 0.5, max: 0.5, c: c || '#e8f0d8', r: rnd(3, 6) });
}
function ring(x, y, c) { FX.push({ k: 'r', x: x, y: y, life: 0.45, max: 0.45, c: c || '#ffe28a', r0: 6, r1: 42 }); }
function updateFX(dt) {
  for (var i = FX.length - 1; i >= 0; i--) {
    var f = FX[i];
    f.life -= dt;
    if (f.k === 't') { f.y += f.vy * dt; f.vy += 34 * dt; }
    if (f.k === 'p') { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 60 * dt; }
    if (f.life <= 0) { FX.splice(i, 1); }
  }
}
function drawFX() {
  for (var i = 0; i < FX.length; i++) {
    var f = FX[i], a = f.life / f.max;
    ctx.globalAlpha = clamp(a, 0, 1);
    if (f.k === 't') { txt(f.s, f.x, f.y, f.sz, f.c); }
    else if (f.k === 'p') { ctx.fillStyle = f.c; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * a, 0, 7); ctx.fill(); }
    else {
      ctx.strokeStyle = f.c; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r0 + (f.r1 - f.r0) * (1 - a), 0, 7); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
}

function resize() {
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  W = window.innerWidth;
  H = window.innerHeight;
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
  buildPlots(D().fieldMax);
  if (S.shopOpen) { panelLayout(); }   // 轉向／縮放時面板位置要重算
}

/* ---------------- 佈局 ---------------- */
function rec(id, x, y, w, h, label, ic) { return { id: id, x: x, y: y, w: w, h: h, label: label, ic: ic }; }
function layout() {
  var pad = Math.max(10, W * 0.035);
  var top = Math.max(78, H * 0.125);
  var gap = H * 0.032;
  var r1 = H * 0.185, r2 = H * 0.165;
  ZONES = [
    rec('field', pad, top, W * 0.40, r1, '田地', '🌾'),
    rec('board', W * 0.50, top, W * 0.46, r1, '裝罐廠', '🥫'),
    rec('shop', pad, top + r1 + gap, W * 0.40, r2, '雜貨店', '🛒'),
    rec('stall', W * 0.50, top + r1 + gap, W * 0.46, r2, '攤位', '🏪')
  ];
  BTN = [
    { id: 'pause', x: W - pad - 44, y: Math.max(10, H * 0.028), w: 44, h: 44 },
    { id: 'sfx', x: pad, y: Math.max(10, H * 0.028), w: 44, h: 44 },
    { id: 'bgm', x: pad + 50, y: Math.max(10, H * 0.028), w: 44, h: 44 }
  ];
  P.setHome(W / 2, H * 0.60);
  if (TREES.length === 0) {
    for (var i = 0; i < 7; i++) {
      TREES.push({ x: rnd(0.03, 0.97) * W, y: rnd(0.56, 0.90) * H, s: rnd(0.7, 1.15) });
    }
  }
  POND = { x: W * 0.82, y: H * 0.80, r: W * 0.13 };
  if (GRASS.length === 0) {
    for (var g = 0; g < 110; g++) {
      GRASS.push({ x: rnd(0.02, 0.98) * W, y: rnd(0.08, 0.99) * H, s: rnd(0.5, 1.1), c: rnd(0, 1) });
    }
  }
  PLOTS_REBUILD = true;
}
function zoneSpot(id) {
  for (var i = 0; i < ZONES.length; i++) {
    var z = ZONES[i];
    if (z.id === id) { return { x: z.x + z.w / 2, y: z.y + z.h - Math.min(26, z.h * 0.18) }; }
  }
  return { x: W / 2, y: H / 2 };
}
function zoneAt(x, y, inset) {
  inset = inset === undefined ? 4 : inset;
  for (var i = 0; i < ZONES.length; i++) {
    var z = ZONES[i];
    if (x > z.x + inset && x < z.x + z.w - inset && y > z.y + inset && y < z.y + z.h - inset) { return z; }
  }
  return null;
}

/* ---------------- 玩家 ---------------- */
var P = {
  x: 0, y: 0, home: { x: 0, y: 0 }, r: 15, dir: 1, act: 0,
  tx: null, walk: false
};
P.setHome = function (x, y) {
  if (!S.started || this.home.x === 0) {
    this.x = x; this.y = y; this.home = { x: x, y: y };
  } else {
    this.x = clamp(this.x, 14, W - 14);
    this.y = clamp(this.y, Math.max(72, H * 0.10), H - 16);
  }
};
var joy = { on: false, ox: 0, oy: 0, x: 0, y: 0, id: null, sx: 0, sy: 0, st: 0, moved: false };

function move(x, y) {
  var z = ZONES.length ? ZONES[0] : null;
  var mx = 14, my = 30;
  P.x = clamp(x, mx, W - mx);
  P.y = clamp(y, Math.max(72, H * 0.10), H - 16);
}
function updatePlayer(dt, d) {
  var vx = 0, vy = 0;
  if (joy.on) {
    var dx = joy.x - joy.ox, dy = joy.y - joy.oy;
    var m = Math.sqrt(dx * dx + dy * dy);
    if (m > 6) { var k = Math.min(1, m / 60); vx = dx / m * k; vy = dy / m * k; }
    P.tx = null;
  } else if (P.tx) {
    var ax = P.tx.x - P.x, ay = P.tx.y - P.y, am = Math.sqrt(ax * ax + ay * ay);
    if (am < 6) { P.tx = null; } else { vx = ax / am; vy = ay / am; }
  }
  var sp = d.spd;
  P.x += vx * sp * dt; P.y += vy * sp * dt;
  P.walk = (vx !== 0 || vy !== 0);
  if (Math.abs(vx) > 0.05) { P.dir = vx > 0 ? 1 : -1; }
  if (P.walk) {
    P.act += dt;
    if (Math.random() < dt * 12) { puff(P.x - P.dir * 10, P.y, 'rgba(255,255,255,0.55)'); }
  } else { P.act += dt * 0.5; }
  move(P.x, P.y);
}

/* ---------------- 區域動作 ---------------- */
function doZone(dt, d) {
  var z = zoneAt(P.x, P.y);
  S.actName = ''; S.actNeed = 1; S.actSub = '';
  if (!z) { S.actT = Math.max(0, S.actT - dt * 2); S.inShop = false; return; }
  // 雜貨店：只在「走進來的那一瞬間」開面板；關掉後還站在店裡不會又跳開（不然會出不來）
  if (z.id === 'shop') {
    if (!S.inShop) { S.inShop = true; openShop(); }
    return;
  }
  S.inShop = false;

  if (z.id === 'field') {
    var sp = space();
    if (sp <= 0) { S.actName = '背包滿了 → 去裝罐廠/攤位'; S.actT = 0; return; }
    if (S.fieldReady < 1) { S.actName = '玉米長大中…'; S.actT = Math.max(0, S.actT - dt * 2); return; }
    S.actName = '收成'; S.actNeed = d.harvestTime; S.actT += dt;
    S.actSub = '田裡還有 ' + Math.floor(S.fieldReady) + ' 株';
    if (S.actT >= S.actNeed) {
      S.actT = 0;
      var n = Math.min(d.carry, Math.floor(S.fieldReady), space());
      S.fieldReady -= n; S.crop += n;
      sHarvest(); ring(P.x, P.y - 34, '#d8f08a');
      popText(P.x, P.y - 56, '+' + n + ' 🌽', '#eaffb0', 21);
      puff(P.x - 12, P.y - 6, '#c9e88a'); puff(P.x + 12, P.y - 6, '#c9e88a');
      if (S.fieldReady < 1) { popText(P.x, P.y - 78, '✓ 田裡的玉米收完了', '#d8ffb0', 17); sUp(); }
    }
    return;
  }
  if (z.id === 'board') {
    if (S.crop < 1) { S.actName = '先去田裡收成'; S.actT = Math.max(0, S.actT - dt * 2); return; }
    S.actName = '裝罐'; S.actNeed = d.chopTime; S.actT += dt;
    S.actSub = '玉米 ' + S.crop + ' 根';
    if (S.actT >= S.actNeed) {
      S.actT = 0;
      var n2 = Math.min(d.carry, S.crop);
      S.crop -= n2; S.veg += n2;
      sChop(); ring(P.x, P.y - 34, '#ffd88a');
      popText(P.x, P.y - 56, '+' + n2 + ' 🥫', '#d6ffd0', 21);
      puff(P.x, P.y - 20, '#cbb389');
      if (S.crop < 1) { popText(P.x, P.y - 78, '✓ 玉米都裝成罐頭了', '#d6ffd0', 17); sUp(); }
    }
    return;
  }
  if (z.id === 'stall') {
    if (S.veg < 1) { S.actName = '沒有罐頭可以上架'; S.actT = Math.max(0, S.actT - dt * 2); return; }
    S.actName = '上架'; S.actNeed = d.shelfTime; S.actT += dt;
    S.actSub = '罐頭 ' + S.veg + ' 罐';
    if (S.actT >= S.actNeed) {
      S.actT = 0;
      var n3 = Math.min(d.carry + 2, S.veg);
      S.veg -= n3; S.stallStock += n3;
      sBell(); ring(P.x, P.y - 34, '#9ad7ff');
      popText(P.x, P.y - 56, '上架 +' + n3, '#cfeaff', 20);
      if (S.veg < 1) { popText(P.x, P.y - 78, '✓ 罐頭都上架了', '#cfeaff', 18); sUp(); }
    }
    return;
  }
}

/* ---------------- 客人 ---------------- */
function spawnCustomer() {
  var d = D();
  var fromLeft = Math.random() < 0.5;
  var c = {
    x: fromLeft ? -20 : W + 20,
    y: H * rnd(0.52, 0.72),
    col: pick(WCOL), skin: pick(['#f7d3ac', '#e8b98c', '#d9a066']),
    st: 'walk', t: 0, slot: S.customers.length, bob: rnd(0, 6),
    want: 2 + Math.floor(lv('sign') / 2)
  };
  S.customers.push(c);
}
function queueSlot(i) {
  var z = null;
  for (var k = 0; k < ZONES.length; k++) { if (ZONES[k].id === 'stall') { z = ZONES[k]; } }

function updateCustomers(dt, d) {

/* ---------------- 自動化：收割機 / 裝罐機 / 搬運車（視覺）＋ 輸送帶 ---------------- */
function makeWorker(type) {
  return { type: type, x: 0, y: 0, ph: 0, t: rnd(0, 1.2), load: 0, bob: rnd(0, 6),
    ox: rnd(-20, 20), oy: rnd(-8, 10), col: pick(WCOL), sp: rnd(0.85, 1.15) };
}
function syncWorkers() {
  var want = { harvest: lv('autoFarm'), can: lv('autoCan'), sell: lv('autoSell') };
  var have = { harvest: 0, can: 0, sell: 0 };
  for (var i = 0; i < S.workers.length; i++) { have[S.workers[i].type] = (have[S.workers[i].type] || 0) + 1; }
  for (var k in want) {
    while (have[k] < want[k]) { var w = makeWorker(k); var s0 = zoneSpot(k === 'harvest' ? 'field' : (k === 'can' ? 'board' : 'stall')); w.x = s0.x + w.ox; w.y = s0.y + w.oy; S.workers.push(w); have[k]++; }
    while (have[k] > want[k]) {
      for (var j = S.workers.length - 1; j >= 0; j--) { if (S.workers[j].type === k) { S.workers.splice(j, 1); break; } }
      have[k]--;
    }
  }
}
function updateWorkers(dt, d) {
  var spots = { field: zoneSpot('field'), board: zoneSpot('board'), stall: zoneSpot('stall') };
  for (var i = 0; i < S.workers.length; i++) {
    var w = S.workers[i];
    var A = w.type === 'harvest' ? spots.field : spots.board;      // 起點
    var B = w.type === 'sell' ? spots.stall : spots.board;         // 終點
    var base = w.ph === 0 ? A : B;
    var tx = base.x + w.ox, ty = base.y + w.oy;
    var ax = tx - w.x, ay = ty - w.y, m = Math.sqrt(ax * ax + ay * ay);
    if (m > 5) {
      var sp = Math.min(76, d.spd * 0.9) * w.sp;
      w.x += ax / m * sp * dt; w.y += ay / m * sp * dt;
      if (Math.random() < dt * 5) { puff(w.x, w.y + 2, 'rgba(255,255,255,0.35)'); }
      w.t = 0;
    } else {
      w.t += dt;
      var wait = w.type === 'harvest' ? 0.9 : (w.type === 'can' ? 0.6 : 0.5);
      if (w.t >= wait) {
        w.t = 0;
        if (w.type === 'harvest') { w.load = w.ph === 0 ? 1 : 0; w.ph = w.ph === 0 ? 1 : 0; }
        else if (w.type === 'sell') { w.load = w.ph === 0 ? 1 : 0; w.ph = w.ph === 0 ? 1 : 0; }
        else { puff(w.x - 8, w.y - 26, 'rgba(255,220,120,0.5)'); }
      }
    }
  }
}
function updateAuto(dt, d) {
  var cap = d.bag;
  // 自動收割：收割機把田裡的玉米收進背包
  var af = lv('autoFarm');
  if (af > 0 && S.fieldReady >= 1 && S.crop + S.veg < cap) {
    S.autoH += dt * af * (0.55 + 0.12 * lv('carry'));
    while (S.autoH >= 1 && S.fieldReady >= 1 && S.crop + S.veg < cap) { S.autoH -= 1; S.fieldReady -= 1; S.crop += 1; }
  }
  // 自動裝罐：輸送帶把玉米送進裝罐機 → 罐頭
  var ac = lv('autoCan');
  if (ac > 0 && S.crop >= 1) {
    S.autoC += dt * ac * (0.50 + 0.12 * lv('carry'));
    while (S.autoC >= 1 && S.crop >= 1) { S.autoC -= 1; S.crop -= 1; S.veg += 1; }
  }
  // 自動運去賣：搬運車把罐頭送上攤位

/* 輸送帶幾何：A = 田地→裝罐廠（橫）、B = 裝罐廠→攤位（直），兩條在裝罐廠下方轉角相接 */
function beltGeom() {

  var ay = b.y + b.h - 14;
  var bx = b.x + b.w * 0.32;
  return {
    a: { x1: f.x + f.w * 0.42, x2: bx, y: ay },

    for (var j = S.bB.length - 1; j >= 0; j--) { S.bB[j].u += dt * 0.34; if (S.bB[j].u > 1) { S.bB.splice(j, 1); } }

function drawBeltSeg(x, y, len, vert) {
  var w = 15;

  ctx.fill();
  ctx.fillStyle = '#39404a';

  ctx.fill();

  ctx.fill();

    else { ctx.beginPath(); ctx.arc(x + i, y, 2.3, 0, 7); ctx.fill(); }

/* ---------------- 輸入 ---------------- */
function inRect(x, y, r) { return x > r.x && x < r.x + r.w && y > r.y && y < r.y + r.h; }
function localXY(e) {
  var r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function down(x, y, id) {
  if (!S.started) {
    if (y > H * 0.70 && y < H * 0.86) { startGame(); }
    return;
  }
  if (S.shopOpen) {
    if (inRect(x, y, PANEL.closeBtn)) { closeShop(); sCust(); return; }
    // ✕ 加大感應範圍
    var clbig = { x: PANEL.close.x - 12, y: PANEL.close.y - 12, w: PANEL.close.w + 24, h: PANEL.close.h + 24 };
    if (inRect(x, y, clbig)) { closeShop(); sCust(); return; }
    // 點面板外面任何地方也能關（最後保險，避免卡在店裡）
    if (x < PANEL.x || x > PANEL.x + PANEL.w || y < PANEL.y || y > PANEL.y + PANEL.h) { closeShop(); sCust(); return; }
    if (inRect(x, y, PANEL.resetBtn)) {
      if (S.resetArm) { resetAll(); }
      else { S.resetArm = 1; popText(W / 2, PANEL.resetBtn.y - 14, '再按一次確認', '#c0392b', 18); }
      return;
    }
    for (var i = 0; i < PANEL.rows.length; i++) {
      if (inRect(x, y, PANEL.rows[i])) { buyU(UPGS[PANEL.rows[i].i]); return; }
    }
    return;
  }
  if (S.paused) {
    if (y > H * 0.48 && y < H * 0.58) { S.paused = false; return; }
    if (y > H * 0.58 && y < H * 0.66) { S.paused = false; openShop(); return; }
    return;
  }
  for (var b = 0; b < BTN.length; b++) {
    var bt = BTN[b];
    if (!inRect(x, y, bt)) { continue; }
    if (bt.id === 'pause') { S.paused = true; save(); return; }
    if (bt.id === 'sfx') { AUD.on = !AUD.on; if (AUD.on) { sCust(); } save(); return; }
    if (bt.id === 'bgm') { AUD.musOn = !AUD.musOn; MUS.next = 0; save(); sCust(); return; }
  }
  if (joy.on) { return; }
  joy.on = true; joy.id = (id === undefined ? 'm' : id); joy.ox = x; joy.oy = y; joy.x = x; joy.y = y;
  joy.sx = x; joy.sy = y; joy.st = performance.now(); joy.moved = false;
}
function moveT(x, y) {
  if (!S.started || S.shopOpen || S.paused) { return; }
  if (!joy.on) { return; }
  joy.x = x; joy.y = y;
  var dx = x - joy.ox, dy = y - joy.oy;
  if (Math.sqrt(dx * dx + dy * dy) > 14) { joy.moved = true; }
  if (Math.sqrt(dx * dx + dy * dy) > 70) {           // 拖太遠 → 拖把跟著走
    var m = Math.sqrt(dx * dx + dy * dy);
    joy.ox = x - dx / m * 70; joy.oy = y - dy / m * 70;
  }
}
function up(x, y) {
  if (!joy.on) { return; }
  var dt = performance.now() - joy.st;
  joy.on = false; joy.id = null; joy.moved = false;
  if (!S.started) { return; }
  if (S.shopOpen || S.paused) { return; }
  if (!joy.moved && dt < 420) {                       // 點擊 → 走過去
    var hit = false;
    for (var b = 0; b < BTN.length; b++) { if (inRect(x, y, BTN[b])) { hit = true; } }
    if (!hit) { P.tx = { x: x, y: y }; ring(x, y, 'rgba(255,255,255,0.7)'); }
  }
}
function pickT(ts) {
  for (var i = 0; i < ts.length; i++) { if (ts[i].identifier === joy.id) { return ts[i]; } }
  return null;
}
cv.addEventListener('touchstart', function (e) {
  e.preventDefault();
  if (joy.on) { return; }
  var t = e.changedTouches[0];
  var p = localXY(t);
  down(p.x, p.y, t.identifier);
}, { passive: false });
cv.addEventListener('touchmove', function (e) {
  e.preventDefault();
  var t = pickT(e.changedTouches);
  if (!t) { return; }
  var p = localXY(t);
  moveT(p.x, p.y);
}, { passive: false });
cv.addEventListener('touchend', function (e) {
  e.preventDefault();
  var t = pickT(e.changedTouches);
  if (!t) { return; }
  var p = localXY(t);
  up(p.x, p.y);
}, { passive: false });
cv.addEventListener('touchcancel', function () { joy.on = false; }, { passive: false });
cv.addEventListener('mousedown', function (e) { var p = localXY(e); down(p.x, p.y, 'm'); });
cv.addEventListener('mousemove', function (e) { if (joy.id !== 'm') { return; } var p = localXY(e); moveT(p.x, p.y); });
window.addEventListener('mouseup', function (e) { if (joy.id !== 'm') { return; } var p = localXY(e); up(p.x, p.y); });
cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
cv.addEventListener('dblclick', function (e) { e.preventDefault(); });
document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

function startGame() {
  S.started = true;
  AC();
  sUp();
  popText(W / 2, H * 0.5, '開始！', '#ffe680', 28);
}
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { S.paused = true; save(); }
});

/* ---------------- 主迴圈 ---------------- */
var last = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!last) { last = ts; }
  var dt = (ts - last) / 1000; last = ts;
  if (dt > 0.12) { dt = 0.12; }
  if (dt < 0) { dt = 0; }
  if (S.started && !S.paused && !S.shopOpen) { update(dt); }
  else { S.t += dt * 0.25; updateFX(dt); }

  drawGround();
  for (var i = 0; i < ZONES.length; i++) {
    var z = ZONES[i], hot = !!zoneAt(P.x, P.y) && zoneAt(P.x, P.y).id === z.id;
    if (z.id === 'field') { drawField(hot); }
    else if (z.id === 'board') { drawBoard(hot); }
    else if (z.id === 'stall') { drawStall(hot); }
    else { drawShopZone(hot); }
  }
  drawBelts();
  drawCustomers();
  drawWorkers();
  drawPlayer();
  drawFX();
  drawHUD();
  if (!S.started) { drawTitle(); }
  else if (S.shopOpen) { drawPanel(); }     // 面板優先畫：狀態和輸入判斷順序要一致
  else if (S.paused) { drawPause(); }
}
(function boot() {
  resize();
  load();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 200); });
  setInterval(save, 5000);
  window.addEventListener('pagehide', save);
  requestAnimationFrame(frame);
})();
window.addEventListener('resize', function () { buildPlots(D().fieldMax); });

/* ---------------- 測試掛勾 ---------------- */
window.__farm = {
  S: S, P: P, D: D, UPGS: UPGS, lv: lv, cost: cost, joy: joy,
  buyU: buyU, openShop: openShop, closeShop: closeShop, startGame: startGame,
  PANEL: PANEL, down: down, zoneAt: zoneAt,
  spawnCustomer: spawnCustomer, makeWorker: makeWorker, resetAll: resetAll,
  zones: function () { return ZONES; }, spots: zoneSpot, save: save, load: load,
  step: function (sec) {
    var n = Math.max(1, Math.round(sec / (1 / 60)));
    for (var i = 0; i < n; i++) { update(1 / 60); }
    return { coins: Math.floor(S.coins), crop: S.crop, veg: S.veg, stock: S.stallStock, fr: Math.round(S.fieldReady * 10) / 10, cust: S.customers.length, wk: S.workers.length };
  },
  put: function (zone) { var s = zoneSpot(zone); P.x = s.x; P.y = s.y; P.tx = null; return [Math.round(P.x), Math.round(P.y)]; },
  say: function () { return S.actName; }
};
</script>
